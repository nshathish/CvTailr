name: Terraform Dev

on:
  pull_request:
    paths:
      - "CvTailr.Infra/**"
      - ".github/workflows/terraform-dev.yml"

  push:
    branches:
      - main
    paths:
      - "CvTailr.Infra/**"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CvTailr.Infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan