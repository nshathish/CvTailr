name: Terraform Dev

on:
  pull_request:
    paths:
      - "CvTailr.Infra/**"
      - ".github/workflows/terraform-dev.yml"

  push:
    branches:
      - main
    paths:
      - "CvTailr.Infra/**"
      - ".github/workflows/terraform-dev.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      # Terraform state / Azure subscription identity
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # CvTailr External ID identity
      TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
      TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}

      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: CvTailr.Infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login - Terraform State
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan - Pull Request
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform Plan - Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform plan -input=false -out=tfplan

      - name: Show Terraform Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: CvTailr.Infra/environments/dev/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan

    runs-on: ubuntu-latest

    # Approval gate
    environment:
      name: dev

    env:
      # Terraform state / Azure subscription identity
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # CvTailr External ID identity
      TF_VAR_entra_client_id: ${{ vars.ENTRA_CLIENT_ID }}
      TF_VAR_entra_tenant_id: ${{ vars.ENTRA_TENANT_ID }}

      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: CvTailr.Infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login - Terraform State
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -reconfigure

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: CvTailr.Infra/environments/dev

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      - name: Terraform Output
        run: terraform output
