name: Terraform Dev

on:
  pull_request:
    paths:
      - "CvTailr.Infra/**"
      - ".github/workflows/terraform-dev.yml"

  push:
    branches:
      - main
    paths:
      - "CvTailr.Infra/**"
      - ".github/workflows/terraform-dev.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: CvTailr.Infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Validate
        run: terraform validate

      # PR: show plan only
      - name: Terraform Plan - Pull Request
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      # Main: save the exact plan that will later be applied
      - name: Terraform Plan - Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform plan -input=false -out=tfplan

      - name: Show Terraform Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: CvTailr.Infra/environments/dev/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan

    runs-on: ubuntu-latest

    # This environment provides the approval gate
    environment:
      name: dev

    env:
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}

    defaults:
      run:
        working-directory: CvTailr.Infra/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: CvTailr.Infra/environments/dev

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      - name: Terraform Output
        run: terraform output
